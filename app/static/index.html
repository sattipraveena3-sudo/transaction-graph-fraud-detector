<!doctype html><html><head><meta charset="utf-8"><script src="https://unpkg.com/cytoscape@3.30.2/dist/cytoscape.min.js"></script><style>body{font:15px system-ui;background:#100b17;color:#f5edff;max-width:1100px;margin:auto;padding:30px}#cy{height:520px;background:#1d1428;border-radius:15px}table{width:100%;margin-top:20px}td,th{padding:8px;text-align:left}</style></head><body><h1>Transaction Graph Fraud Detector</h1><p id="metric"></p><div id="cy"></div><table id="alerts"></table><script>Promise.all([fetch('/graph').then(r=>r.json()),fetch('/alerts').then(r=>r.json()),fetch('/health').then(r=>r.json())]).then(([g,a,h])=>{metric.textContent=`Evaluation — precision ${h.evaluation.precision.toFixed(3)}, recall ${h.evaluation.recall.toFixed(3)}, AUC ${h.evaluation.roc_auc.toFixed(3)}`;cytoscape({container:cy,elements:[...g.nodes.map(n=>({data:n})),...g.edges.map(e=>({data:e}))],style:[{selector:'node',style:{'background-color':'#8b5cf6','label':'data(id)','font-size':7}},{selector:'node[flagged]',style:{'background-color':'#fb7185','width':18,'height':18}},{selector:'edge',style:{'line-color':'#49375d','width':1}}],layout:{name:'cose'}});alerts.innerHTML='<tr><th>Account</th><th>Score</th><th>Explanation</th></tr>'+a.map(x=>`<tr><td>${x.account}</td><td>${x.score.toFixed(4)}</td><td>${x.explanation}</td></tr>`).join('')})</script></body></html>
