services:
  app:
    build: .
    ports:
      - "8000:8000"
    environment:
      DATABASE_PATH: /app/data/fraud.db
      CONTAMINATION: ${CONTAMINATION:-0.08}
      HIGH_AMOUNT_THRESHOLD: ${HIGH_AMOUNT_THRESHOLD:-7500}
      VELOCITY_THRESHOLD: ${VELOCITY_THRESHOLD:-8}
      INGESTION_API_KEY: ${INGESTION_API_KEY:-}
    volumes:
      - ./data:/app/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/ready')"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  neo4j:
    image: neo4j:5.24-community
    profiles: ["neo4j"]
    environment:
      NEO4J_AUTH: neo4j/${NEO4J_PASSWORD:-portfolio-password}
    ports:
      - "7474:7474"
      - "7687:7687"
    volumes:
      - neo4j_data:/data

volumes:
  neo4j_data:
